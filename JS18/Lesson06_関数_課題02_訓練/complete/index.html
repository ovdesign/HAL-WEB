<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson6 関数</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Lesson6 関数</h1>
    <div id="calculator" class="card"></div>
    <div id="price" class="card"></div>
    <section id="taxForm" class="card">
      <h2>税込価格を計算</h2>
      <div class="number"><label>商品価格：<input type="number" id="priceInput" value="1200" min="0"></label></div>
      <div class="number"><label>消費税率：<input type="number" id="taxRateInput" value="0.1" step="0.01" min="0"></label></div>
      <button id="calcButton">計算する</button>
      <p id="taxResult"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
