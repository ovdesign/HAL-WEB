<!DOCTYPE HTML>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<title>Media Query</title>
	<style type="text/css">
		body {
			background: #59b9c6;
			color: #ffffca;
		}

		h1 {
			color: #ffffca;
		}

		.wrapper {
			border: solid 2px #ffffca;
			padding: 20px;
			margin: 40px;
			border-radius: 20px;
		}

		/* スマホサイズ */
		@media (width < 600px) {
			.sp {
				background: #ffffca;
				color: #59b9c6;
				font-weight: bold;
			}


		}

		/* タブレットサイズ */
		@media (600px <=width < 960px) {
			.tb {
				background: #ffffca;
				color: #59b9c6;
				font-weight: bold;
			}

		}

		/* PCサイズ */
		@media (960px <=width) {
			.pc {
				background: #ffffca;
				color: #59b9c6;
				font-weight: bold;
			}

		}
	</style>
</head>

<body>
	<h1>メディアクエリの実装</h1>
	<div class="wrapper pc">960px以上・・・PCサイズ</div>
	<div class="wrapper tb">600pxから959px・・・タブレットサイズ</div>
	<div class="wrapper sp"> 599px以下・・・スマホサイズ</div>



</body>

</html>
